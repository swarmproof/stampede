name: release-core

# Publishes `agent-reliability-core` (the vendored primitives under core/) to PyPI
# when a `core-v*` tag is pushed. Uses PyPI Trusted Publishing (OIDC) — no API token
# is stored. See core/RELEASING.md for the one-time PyPI configuration.

on:
  push:
    tags: ["core-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + check the distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build core/
          python -m twine check core/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: core/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi           # add required reviewers here to gate releases
    permissions:
      id-token: write           # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
