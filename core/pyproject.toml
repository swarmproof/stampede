[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-core"
version = "0.1.0"
description = "Shared primitives for the Swarm Proof agent-reliability toolkit — the OTel GenAI trace-format, and (soon) persona-pack, report-renderer, and concurrency-core."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Swarm Proof" }]
keywords = ["opentelemetry", "gen-ai", "agents", "reliability", "trace-format"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
# trace-format and concurrency-core are stdlib-only; persona-pack needs a schema
# layer (pydantic) and its YAML packs (pyyaml).
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# OTLP export helpers (the wire format itself needs nothing).
otel = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]
# The report-renderer's HTML + terminal backends (the model + theme need neither).
render = ["jinja2>=3.1", "rich>=13.7"]

[project.urls]
Homepage = "https://github.com/swarmproof/agent-reliability-core"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability_core"]
